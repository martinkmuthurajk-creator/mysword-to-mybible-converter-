
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MySword to MyBible Converter - Version 3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 750px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #1e3a8a;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .status {
      padding: 15px;
      background: #eff6ff;
      border-radius: 8px;
      color: #1e40af;
      margin-top: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #inspectionResult {
      margin-top: 20px;
      padding: 15px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .success {
      color: #166534;
      background: #f0fdf4;
    }

    .error {
      color: #991b1b;
      background: #fef2f2;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>MySword → MyBible Converter</h1>
    <p>Commentary SQLite Conversion Tool</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>📁 MySword Source File</h2>

      <label for="sourceFile">
        MySword Commentary Database
      </label>

      <input
        type="file"
        id="sourceFile"
        accept=".twm,.sqlite,.sqlite3,.db"
      >

      <div class="status" id="sourceStatus">
        No file selected.
      </div>
    </section>

    <section class="card">
      <h2>🗄️ MyBible Target File</h2>

      <label for="targetFile">
        MyBible SQLite3 Database
      </label>

      <input
        type="file"
        id="targetFile"
        accept=".sqlite,.sqlite3,.db"
      >

      <div class="status" id="targetStatus">
        No target file selected.
      </div>
    </section>

    <section class="card">
      <h2>⚙️ Database Inspection</h2>

      <p>
        Inspect tables, columns, and database structure.
      </p>

      <button id="inspectButton" disabled>
        Inspect Both Databases
      </button>

      <div id="inspectionResult" hidden></div>
    </section>

  </main>

  <footer>
    MySword → MyBible Converter | Development Version
  </footer>

  <!-- SQLite Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <script>
    const sourceFile = document.getElementById("sourceFile");
    const targetFile = document.getElementById("targetFile");

    const sourceStatus = document.getElementById("sourceStatus");
    const targetStatus = document.getElementById("targetStatus");

    const inspectButton = document.getElementById("inspectButton");
    const result = document.getElementById("inspectionResult");

    let SQL = null;

    // Load SQLite library
    initSqlJs({
      locateFile: function(file) {
        return "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/" + file;
      }
    })
    .then(function(sqlModule) {
      SQL = sqlModule;
      updateButtonState();
    })
    .catch(function(error) {
      result.hidden = false;
      result.className = "error";
      result.textContent =
        "SQLite library loading error:\n" + error.message;
    });

    // Update button state
    function updateButtonState() {
      inspectButton.disabled =
        !SQL || !sourceFile.files.length;
    }

    // Source file selection
    sourceFile.addEventListener("change", function() {
      if (sourceFile.files.length > 0) {
        sourceStatus.textContent =
          "Selected: " + sourceFile.files[0].name;
      } else {
        sourceStatus.textContent = "No file selected.";
      }

      updateButtonState();
    });

    // Target file selection
    targetFile.addEventListener("change", function() {
      if (targetFile.files.length > 0) {
        targetStatus.textContent =
          "Selected: " + targetFile.files[0].name;
      } else {
        targetStatus.textContent = "No target file selected.";
      }
    });

    // Inspect database structure
    function inspectDatabase(file) {
      return new Promise(async function(resolve, reject) {
        try {
          const buffer = await file.arrayBuffer();

          const database = new SQL.Database(
            new Uint8Array(buffer)
          );

          const tables = database.exec(
            "SELECT name FROM sqlite_master " +
            "WHERE type='table' " +
            "AND name NOT LIKE 'sqlite_%' " +
            "ORDER BY name"
          );

          let output = "";
          output += "FILE: " + file.name + "\n";
          output += "================================\n\n";

          if (!tables.length) {
            output += "No tables found.\n";
            database.close();
            resolve(output);
            return;
          }

          tables[0].values.forEach(function(row) {
            const tableName = row[0];

            output += "TABLE: " + tableName + "\n";
            output += "--------------------------------\n";

            const schema = database.exec(
              "PRAGMA table_info('" +
              tableName.replace(/'/g, "''") +
              "')"
            );

            if (schema.length) {
              schema[0].values.forEach(function(column) {
                const columnId = column[0];
                const columnName = column[1];
                const columnType = column[2];
                const notNull = column[3];
                const defaultValue = column[4];
                const primaryKey = column[5];

                output +=
                  "Column: " + columnName + "\n" +
                  "Type: " + (columnType || "UNKNOWN") + "\n" +
                  "Not Null: " + notNull + "\n" +
                  "Default: " + (defaultValue ?? "NULL") + "\n" +
                  "Primary Key: " + primaryKey + "\n\n";
              });
            }

            output += "\n";
          });

          database.close();
          resolve(output);

        } catch (error) {
          reject(error);
        }
      });
    }

    // Inspect button
    inspectButton.addEventListener("click", async function() {
      if (!sourceFile.files.length) {
        result.hidden = false;
        result.className = "error";
        result.textContent = "Please select a MySword file.";
        return;
      }

      if (!SQL) {
        result.hidden = false;
        result.className = "error";
        result.textContent =
          "SQLite library is still loading. Please try again.";
        return;
      }

      result.hidden = false;
      result.className = "";
      result.textContent = "Inspecting database structures...";

      try {
        let finalOutput = "";

        // Inspect MySword file
        finalOutput += "===== MYSWORD DATABASE =====\n\n";

        const sourceOutput = await inspectDatabase(
          sourceFile.files[0]
        );

        finalOutput += sourceOutput;

        // Inspect MyBible file if selected
        if (targetFile.files.length > 0) {
          finalOutput +=
            "\n\n===== MYBIBLE DATABASE =====\n\n";

          const targetOutput = await inspectDatabase(
            targetFile.files[0]
          );

          finalOutput += targetOutput;
        } else {
          finalOutput +=
            "\n\nMyBible target file was not selected.";
        }

        result.className = "success";
        result.textContent = finalOutput;

      } catch (error) {
        result.className = "error";
        result.textContent =
          "Database Inspection Error:\n" + error.message;
      }
    });
  </script>

</body>
</html>
